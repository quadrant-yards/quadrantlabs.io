<!--
  Quadrant — Email Signature
  ──────────────────────────
  Usage:
    Gmail:   Settings → See all settings → General → Signature → Create new → paste HTML
    Outlook: New Email → Insert → Signature → Edit Signatures → paste HTML

  Replace [YOUR NAME], [YOUR TITLE], [YOUR EMAIL], and [WEBSITE] before use.
  Font (Jost) may not render in all email clients — Helvetica Neue is the fallback.
-->
<table cellpadding="0" cellspacing="0" border="0"
       style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #0E1F40;">
  <tr>
    <td style="padding-right: 20px; vertical-align: middle; border-right: 1px solid #D0CCBF;">

      <!-- Mark (inline SVG as image for email compatibility) -->
      <img width="40" height="35" alt="Quadrant"
           src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5 5 90 78' fill='none'%3E%3Cpath d='M 50,10 L 11,65.7 A 68,68 0 0,0 89,65.7 Z' stroke='%230E1F40' stroke-width='5' stroke-linejoin='miter' fill='none'/%3E%3Cline x1='50' y1='10' x2='50' y2='78' stroke='%230E1F40' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"/>

    </td>
    <td style="padding-left: 20px; vertical-align: middle;">

      <!-- Company name -->
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.18em;
                  text-transform: uppercase; color: #0E1F40; margin-bottom: 6px;">
        Quadrant
      </div>

      <!-- Name & title -->
      <div style="font-size: 14px; font-weight: 500; color: #0E1F40; margin-bottom: 2px;">
        [YOUR NAME]
      </div>
      <div style="font-size: 13px; color: #6B7A99; margin-bottom: 10px;">
        Fractional CTO
      </div>

      <!-- Contact links -->
      <div style="font-size: 12px; color: #6B7A99;">
        <a href="mailto:[YOUR EMAIL]"
           style="color: #6B7A99; text-decoration: none;">[YOUR EMAIL]</a>
        <span style="margin: 0 6px; color: #D0CCBF;">·</span>
        <a href="https://[WEBSITE]"
           style="color: #6B7A99; text-decoration: none;">[WEBSITE]</a>
      </div>

    </td>
  </tr>
</table>
