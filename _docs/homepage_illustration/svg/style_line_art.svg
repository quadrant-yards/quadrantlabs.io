<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="620" fill="#FAF8F4"/>

  <!-- horizon -->
  <line x1="50" y1="478" x2="850" y2="478" stroke="#22201C" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

  <!-- suggested waves -->
  <path d="M120,512 Q150,502 180,512 T240,512" fill="none" stroke="#22201C" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <path d="M660,522 Q690,512 720,522 T780,522" fill="none" stroke="#22201C" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <path d="M330,458 Q360,450 390,458" fill="none" stroke="#22201C" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <g transform="rotate(-5 470 380)">
    <!-- mast -->
    <line x1="500" y1="95" x2="500" y2="323" stroke="#22201C" stroke-width="5" stroke-linecap="round"/>
    <!-- boom -->
    <line x1="498" y1="298" x2="345" y2="312" stroke="#22201C" stroke-width="5" stroke-linecap="round"/>

    <!-- jib (forward headsail) -->
    <path d="M500,95 L680,378 L560,345 C545,270 520,170 500,95 Z" fill="#FAF8F4" stroke="#22201C" stroke-width="5" stroke-linejoin="round"/>
    <!-- staysail (inner headsail) -->
    <path d="M505,130 L505,295 L615,325 C575,255 535,185 505,130 Z" fill="#FAF8F4" stroke="#22201C" stroke-width="5" stroke-linejoin="round"/>
    <!-- mainsail -->
    <path d="M500,95 L500,300 L350,312 C400,230 460,150 500,95 Z" fill="#FAF8F4" stroke="#22201C" stroke-width="5" stroke-linejoin="round"/>

    <!-- hull -->
    <path d="M300,345 C400,325 560,320 665,330 C685,345 695,365 690,390 C650,430 550,448 460,445 C380,447 320,435 300,410 C295,395 296,365 300,345 Z" fill="#FAF8F4" stroke="#22201C" stroke-width="5" stroke-linejoin="round"/>

    <!-- boot stripe accent -->
    <path d="M312,388 C400,378 520,372 652,358 C657,362 657,366 652,370 C520,384 400,392 312,402 C307,397 307,392 312,388 Z" fill="#1F3A5F" stroke="none"/>

    <!-- rubrail -->
    <path d="M304,350 C400,332 558,327 660,337" fill="none" stroke="#22201C" stroke-width="5" stroke-linecap="round"/>

    <!-- portholes -->
    <circle cx="400" cy="365" r="9" fill="#FAF8F4" stroke="#22201C" stroke-width="5"/>
    <circle cx="368" cy="368" r="9" fill="#FAF8F4" stroke="#22201C" stroke-width="5"/>
    <circle cx="336" cy="371" r="9" fill="#FAF8F4" stroke="#22201C" stroke-width="5"/>

    <!-- pilothouse cabin -->
    <path d="M465,323 L465,288 C465,275 478,268 498,267 L552,267 C570,268 580,275 580,288 L580,323" fill="none" stroke="#22201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="480" y="288" width="16" height="18" fill="#1F3A5F"/>
    <rect x="508" y="288" width="16" height="18" fill="#1F3A5F"/>
    <rect x="536" y="288" width="16" height="18" fill="#1F3A5F"/>
  </g>
</svg>
