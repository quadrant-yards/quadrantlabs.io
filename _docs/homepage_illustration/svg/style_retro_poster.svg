<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4B4F"/>
      <stop offset="100%" stop-color="#C46A5E"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="900" height="190" fill="#1B4B4F"/>
  <rect x="0" y="190" width="900" height="90" fill="url(#skyGrad)"/>
  <rect x="0" y="280" width="900" height="100" fill="#D9713C"/>

  <!-- birds -->
  <path d="M120,110 q10,-12 20,0 q10,-12 20,0" fill="none" stroke="#1A1A17" stroke-width="3" stroke-linecap="round"/>
  <path d="M180,150 q8,-10 16,0 q8,-10 16,0" fill="none" stroke="#1A1A17" stroke-width="3" stroke-linecap="round"/>
  <path d="M760,90 q9,-11 18,0 q9,-11 18,0" fill="none" stroke="#1A1A17" stroke-width="3" stroke-linecap="round"/>

  <!-- sun (clipped by horizon/water) -->
  <circle cx="650" cy="345" r="95" fill="#F2E8D5"/>

  <!-- water -->
  <rect x="0" y="380" width="900" height="240" fill="#1B4B4F"/>

  <!-- sun reflection -->
  <polygon points="600,380 700,380 690,430 610,430" fill="#F2E8D5" opacity="0.55"/>
  <polygon points="615,430 685,430 675,470 625,470" fill="#D9713C" opacity="0.45"/>
  <polygon points="630,470 670,470 663,505 637,505" fill="#C46A5E" opacity="0.4"/>

  <!-- distant Chesapeake shoreline: marsh, pines, lighthouse, duck blind -->
  <g>
    <polygon points="20,382 60,340 100,382" fill="#1A1A17"/>
    <polygon points="55,382 90,330 128,382" fill="#1A1A17"/>
    <path d="M140,382 L146,352 L152,382 Z" fill="#1B4B4F"/>
    <path d="M155,382 L161,348 L167,382 Z" fill="#1B4B4F"/>
    <path d="M170,382 L176,355 L182,382 Z" fill="#1B4B4F"/>
    <path d="M185,382 L191,350 L197,382 Z" fill="#1B4B4F"/>
    <!-- lighthouse -->
    <polygon points="222,382 228,335 236,335 242,382" fill="#F2E8D5"/>
    <rect x="226" y="335" width="12" height="8" fill="#D9713C"/>
    <polygon points="223,335 241,335 232,325" fill="#5C2A3A"/>
    <!-- duck blind -->
    <rect x="255" y="368" width="26" height="14" fill="#5C2A3A"/>
    <polygon points="253,368 268,354 283,368" fill="#5C2A3A"/>
  </g>

  <!-- boat, slight heel -->
  <g transform="rotate(-5 545 415)">
    <!-- rigging -->
    <line x1="523" y1="352" x2="523" y2="98" stroke="#1A1A17" stroke-width="5"/>
    <path d="M523,352 Q440,368 350,378" fill="none" stroke="#A9702E" stroke-width="9" stroke-linecap="round"/>

    <!-- jib -->
    <path d="M523,180 Q640,290 745,400 L523,350 Z" fill="#FBF7EE" stroke="#1A1A17" stroke-width="3" stroke-linejoin="round"/>
    <!-- mainsail -->
    <path d="M523,130 Q400,260 350,375 L523,352 Z" fill="#FBF7EE" stroke="#1A1A17" stroke-width="3" stroke-linejoin="round"/>

    <!-- hull -->
    <path d="M300,415 Q520,368 758,402 Q600,468 460,466 Q360,462 300,435 Z"
          fill="#F2E8D5" stroke="#1A1A17" stroke-width="4" stroke-linejoin="round"/>
    <!-- boot stripe -->
    <path d="M322,430 Q520,400 748,406 Q600,436 460,438 Q378,436 322,430 Z" fill="#5C2A3A"/>
    <!-- rubrail -->
    <path d="M304,417 Q520,371 756,404" fill="none" stroke="#A9702E" stroke-width="4" stroke-linecap="round"/>

    <!-- pilothouse cabin -->
    <path d="M478,347 L568,340 L572,383 L474,386 Z" fill="#EADFC6" stroke="#1A1A17" stroke-width="3" stroke-linejoin="round"/>
    <rect x="486" y="352" width="14" height="14" fill="#1A1A17"/>
    <rect x="510" y="350" width="14" height="14" fill="#1A1A17"/>
    <rect x="534" y="349" width="14" height="14" fill="#1A1A17"/>

    <!-- portholes -->
    <circle cx="378" cy="418" r="7" fill="#1A1A17"/>
    <circle cx="404" cy="422" r="7" fill="#1A1A17"/>
    <circle cx="430" cy="425" r="7" fill="#1A1A17"/>
  </g>

  <!-- wake / ripples -->
  <path d="M260,470 q30,10 60,0 q30,10 60,0 q30,10 60,0" fill="none" stroke="#F2E8D5" stroke-width="3" opacity="0.35"/>
  <path d="M300,505 q35,10 70,0 q35,10 70,0 q35,10 70,0" fill="none" stroke="#F2E8D5" stroke-width="3" opacity="0.25"/>
  <path d="M120,545 q40,10 80,0 q40,10 80,0 q40,10 80,0 q40,10 80,0" fill="none" stroke="#F2E8D5" stroke-width="3" opacity="0.2"/>
</svg>
