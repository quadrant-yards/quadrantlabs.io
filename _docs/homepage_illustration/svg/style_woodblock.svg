    <polygon points="55,345 47,345 55,303 63,345"/>
    <polygon points="95,345 88,345 95,321 102,345"/>
    <polygon points="135,345 127,345 135,299 143,345"/>
    <polygon points="175,345 168,345 175,325 182,345"/>
    <polygon points="215,345 207,345 215,309 223,345"/>
    <polygon points="255,345 246,345 255,295 264,345"/>
    <polygon points="295,345 288,345 295,317 302,345"/>
    <polygon points="335,345 327,345 335,305 343,345"/>
    <polygon points="375,345 369,345 375,327 381,345"/>
    <polygon points="655,345 647,345 655,299 663,345"/>
    <polygon points="700,345 692,345 700,313 708,345"/>
    <polygon points="745,345 736,345 745,291 754,345"/>
    <polygon points="790,345 783,345 790,317 797,345"/>
    <polygon points="820,345 813,345 820,321 827,345"/>
