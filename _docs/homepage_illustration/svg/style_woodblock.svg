    <path fill="none" stroke="#EDE3CE" stroke-width="3" d="M880,545 Q865,552 850,540"/>
    <path fill="none" stroke="#EDE3CE" stroke-width="3" d="M836,530 Q822,538 808,527"/>
    <path fill="none" stroke="#EDE3CE" stroke-width="3" d="M792,522 Q778,528 764,520"/>
    <circle cx="842" cy="522" r="3" fill="#EDE3CE"/>
    <circle cx="800" cy="510" r="2.5" fill="#EDE3CE"/>
    <circle cx="758" cy="508" r="2.5" fill="#EDE3CE"/>
  </g>

  <!-- ================= BOAT ================= -->
  <g id="boat" transform="translate(470,440) rotate(-7)">

    <!-- hull -->
    <polygon points="-170,-40 -150,-52 -60,-58 40,-62 120,-72 190,-85 200,-60 195,-20 180,10 120,35 20,42 -80,30 -150,5 -170,-10"
      fill="#EDE3CE" stroke="#1D2B3A" stroke-width="5" stroke-linejoin="round"/>

    <!-- boot stripe -->
    <polygon points="-165,-15 -60,-18 40,-20 120,-26 185,-32 185,-14 120,-8 20,0 -80,4 -160,0"
      fill="#A13D2B" stroke="#1D2B3A" stroke-width="1"/>

    <!-- hull topside shading hatch -->
    <g stroke="#1D2B3A" stroke-width="2">
      <line x1="-140" y1="-50" x2="-130" y2="-38"/>
      <line x1="-115" y1="-52" x2="-105" y2="-40"/>
      <line x1="-90" y1="-54" x2="-80" y2="-42"/>
      <line x1="-60" y1="-56" x2="-50" y2="-44"/>
      <line x1="-30" y1="-58" x2="-20" y2="-46"/>
      <line x1="0" y1="-59" x2="10" y2="-47"/>
      <line x1="30" y1="-60" x2="40" y2="-48"/>
      <line x1="60" y1="-63" x2="70" y2="-51"/>
      <line x1="90" y1="-66" x2="100" y2="-54"/>
      <line x1="120" y1="-70" x2="130" y2="-58"/>
      <line x1="150" y1="-75" x2="160" y2="-63"/>
    </g>
    <!-- hull below-waterline shading hatch -->
