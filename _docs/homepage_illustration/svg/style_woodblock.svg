    <path stroke-width="1.5" d="M0,400 q22,7 45,0 q23,-7 45,0 q22,7 45,0 q23,-7 45,0 q22,7 45,0 q23,-7 45,0 q22,7 45,0 q23,-7 45,0 q22,7 45,0 q23,-7 45,0"/>
    <path stroke-width="1.8" d="M0,505 q24,-9 48,0 q24,9 48,0 q24,-9 48,0 q24,9 48,0 q24,-9 48,0 q24,9 48,0 q24,-9 48,0 q24,9 48,0 q24,-9 48,0"/>
    <path stroke-width="2" d="M0,535 q26,10 52,0 q26,-10 52,0 q26,10 52,0 q26,-10 52,0 q26,10 52,0 q26,-10 52,0 q26,10 52,0 q26,-10 52,0"/>
    <path stroke-width="2.2" d="M0,565 q28,-12 56,0 q28,12 56,0 q28,-12 56,0 q28,12 56,0 q28,-12 56,0 q28,12 56,0 q28,-12 56,0"/>
    <path stroke-width="2.4" d="M0,595 q30,13 60,0 q30,-13 60,0 q30,13 60,0 q30,-13 60,0 q30,13 60,0 q30,-13 60,0"/>
