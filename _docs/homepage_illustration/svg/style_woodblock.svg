  <!-- marsh grass tufts along shoreline -->
  <g id="marsh-left" stroke="#1D2B3A" stroke-width="1.5" fill="none">
    <path d="M10,362 Q14,345 8,330"/>
    <path d="M20,364 Q26,348 22,328"/>
    <path d="M30,363 Q34,350 38,332"/>
    <path d="M400,352 Q404,340 400,326"/>
    <path d="M412,353 Q417,342 421,328"/>
    <path d="M424,352 Q427,343 424,332"/>
  </g>
  <g id="marsh-right" stroke="#1D2B3A" stroke-width="1.5" fill="none">
    <path d="M870,363 Q874,347 869,330"/>
    <path d="M882,364 Q888,349 884,330"/>
    <path d="M892,362 Q896,350 900,335"/>
