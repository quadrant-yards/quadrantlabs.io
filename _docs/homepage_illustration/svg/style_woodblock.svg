    <path fill="none" stroke="#EDE3CE" stroke-width="3" d="M20,545 Q35,552 50,540"/>
    <path fill="none" stroke="#EDE3CE" stroke-width="3" d="M64,530 Q78,538 92,527"/>
    <path fill="none" stroke="#EDE3CE" stroke-width="3" d="M108,522 Q122,528 136,520"/>
    <circle cx="58" cy="522" r="3" fill="#EDE3CE"/>
    <circle cx="100" cy="510" r="2.5" fill="#EDE3CE"/>
    <circle cx="142" cy="508" r="2.5" fill="#EDE3CE"/>
