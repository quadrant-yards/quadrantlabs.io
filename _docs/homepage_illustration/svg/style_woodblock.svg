    <line x1="776.8" y1="58.2" x2="790.9" y2="44.1" stroke="#1D2B3A" stroke-width="4"/>
    <line x1="792" y1="95" x2="812" y2="95" stroke="#1D2B3A" stroke-width="4"/>
    <line x1="776.8" y1="131.8" x2="790.9" y2="145.9" stroke="#1D2B3A" stroke-width="4"/>
