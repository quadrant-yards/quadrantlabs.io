    <!-- pilothouse cabin -->
    <polygon points="-20,-62 -20,-102 55,-102 60,-62" fill="#EDE3CE" stroke="#1D2B3A" stroke-width="3"/>
    <rect x="-11" y="-96" width="14" height="16" fill="#1D2B3A"/>
    <rect x="8" y="-96" width="14" height="16" fill="#1D2B3A"/>
    <rect x="27" y="-96" width="14" height="16" fill="#1D2B3A"/>

    <!-- portholes -->
    <circle cx="-55" cy="-32" r="7" fill="#EDE3CE" stroke="#1D2B3A" stroke-width="2.5"/>
    <circle cx="-85" cy="-32" r="7" fill="#EDE3CE" stroke="#1D2B3A" stroke-width="2.5"/>
    <circle cx="-115" cy="-32" r="7" fill="#EDE3CE" stroke="#1D2B3A" stroke-width="2.5"/>

    <!-- backstay -->
    <line x1="20" y1="-330" x2="-165" y2="-45" stroke="#1D2B3A" stroke-width="1.5"/>

    <!-- sails -->
    <path d="M20,-330 Q -55,-205 -140,-58 L20,-64 Z" fill="#EDE3CE" stroke="#1D2B3A" stroke-width="3"/>
    <path d="M20,-320 Q 110,-175 240,-78 L70,-95 Z" fill="#EDE3CE" stroke="#1D2B3A" stroke-width="3"/>
    <path d="M20,-230 Q 75,-165 100,-72 L45,-90 Z" fill="#EDE3CE" stroke="#1D2B3A" stroke-width="3"/>

    <!-- sail seam hatching -->
    <g stroke="#1D2B3A" stroke-width="1.3" fill="none">
      <path d="M20,-270 L-40,-230"/>
      <path d="M20,-210 L-70,-160"/>
      <path d="M20,-150 L-100,-110"/>
      <path d="M20,-90 L-120,-70"/>

      <path d="M60,-300 L110,-230"/>
      <path d="M100,-270 L150,-190"/>
      <path d="M150,-230 L190,-140"/>

      <path d="M35,-200 L60,-150"/>
      <path d="M50,-160 L75,-120"/>
    </g>

    <!-- sail shadow crosshatch near foot -->
    <g stroke="#1D2B3A" stroke-width="1.3">
      <line x1="-125" y1="-58" x2="-105" y2="-72"/>
      <line x1="-115" y1="-52" x2="-95" y2="-66"/>
      <line x1="-105" y1="-46" x2="-85" y2="-60"/>
      <line x1="55" y1="-98" x2="80" y2="-84"/>
      <line x1="62" y1="-108" x2="87" y2="-94"/>
      <line x1="30" y1="-92" x2="50" y2="-80"/>
    </g>

    <!-- mast, boom, bowsprit -->
    <line x1="20" y1="-64" x2="20" y2="-330" stroke="#1D2B3A" stroke-width="6"/>
    <line x1="20" y1="-64" x2="-140" y2="-58" stroke="#1D2B3A" stroke-width="5"/>
    <line x1="195" y1="-72" x2="245" y2="-80" stroke="#1D2B3A" stroke-width="4"/>

    <!-- masthead flag -->
    <polygon points="20,-330 46,-322 20,-315" fill="#A13D2B" stroke="#1D2B3A" stroke-width="1"/>
  </g>
</svg>
