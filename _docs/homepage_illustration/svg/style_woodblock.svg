    <line x1="260" y1="392" x2="272" y2="386"/>
    <line x1="650" y1="390" x2="662" y2="384"/>
    <line x1="770" y1="386" x2="782" y2="380"/>
    <line x1="60" y1="415" x2="72" y2="409"/>
    <line x1="780" y1="412" x2="792" y2="406"/>
    <line x1="150" y1="520" x2="166" y2="512"/>
    <line x1="740" y1="522" x2="756" y2="514"/>
    <line x1="200" y1="548" x2="218" y2="539"/>
    <line x1="700" y1="550" x2="718" y2="541"/>
    <line x1="80" y1="580" x2="100" y2="570"/>
    <line x1="800" y1="578" x2="820" y2="568"/>
