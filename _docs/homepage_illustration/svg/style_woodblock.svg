  <!-- hull reflection ripple beneath boat -->
  <g fill="none" stroke="#1D2B3A">
    <path stroke-width="2" d="M320,432 Q470,425 620,432"/>
    <path stroke-width="1.6" d="M340,448 Q470,442 600,448"/>
    <path stroke-width="1.3" d="M360,463 Q470,458 580,463"/>
  </g>

  <!-- bow spray -->
  <g fill="none" stroke="#1D2B3A" stroke-width="2">
    <path d="M661,356 Q642,340 654,320"/>
    <path d="M672,349 Q683,326 703,314"/>
    <path d="M648,366 Q628,375 608,369"/>
