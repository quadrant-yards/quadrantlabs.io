      <line x1="-110" y1="8" x2="-100" y2="18"/>
      <line x1="-70" y1="10" x2="-60" y2="20"/>
      <line x1="-30" y1="12" x2="-20" y2="22"/>
      <line x1="10" y1="14" x2="20" y2="24"/>
      <line x1="50" y1="10" x2="60" y2="20"/>
      <line x1="90" y1="5" x2="100" y2="15"/>
      <line x1="130" y1="0" x2="140" y2="10"/>
    </g>

    <!-- rubrail -->
    <path fill="none" stroke="#A13D2B" stroke-width="3"
