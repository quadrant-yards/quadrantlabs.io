<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect x="0" y="0" width="900" height="620" fill="#8FD3E8"/>

  <!-- Sun -->
  <g>
    <rect x="765" y="15" width="10" height="26" rx="5" fill="#F4C64F" transform="rotate(0 770 95)"/>
    <rect x="765" y="15" width="10" height="26" rx="5" fill="#F4C64F" transform="rotate(45 770 95)"/>
    <rect x="765" y="15" width="10" height="26" rx="5" fill="#F4C64F" transform="rotate(90 770 95)"/>
    <rect x="765" y="15" width="10" height="26" rx="5" fill="#F4C64F" transform="rotate(135 770 95)"/>
    <rect x="765" y="15" width="10" height="26" rx="5" fill="#F4C64F" transform="rotate(180 770 95)"/>
    <rect x="765" y="15" width="10" height="26" rx="5" fill="#F4C64F" transform="rotate(225 770 95)"/>
    <rect x="765" y="15" width="10" height="26" rx="5" fill="#F4C64F" transform="rotate(270 770 95)"/>
    <rect x="765" y="15" width="10" height="26" rx="5" fill="#F4C64F" transform="rotate(315 770 95)"/>
    <circle cx="770" cy="95" r="50" fill="#F4C64F"/>
  </g>

  <!-- Gulls -->
  <path d="M -22,0 C -14,-13 -7,-13 0,0 C 7,-13 14,-13 22,0" stroke="#33475B" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(150,165)"/>
  <path d="M -22,0 C -14,-13 -7,-13 0,0 C 7,-13 14,-13 22,0" stroke="#33475B" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(600,135) scale(0.75)"/>
  <path d="M -22,0 C -14,-13 -7,-13 0,0 C 7,-13 14,-13 22,0" stroke="#33475B" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(90,240) scale(0.6)"/>

  <!-- Distant lighthouse -->
  <g>
    <rect x="805" y="345" width="20" height="52" rx="3" fill="#FBF3E3" stroke="#33475B" stroke-width="2"/>
    <rect x="805" y="362" width="20" height="10" fill="#F17A5D"/>
    <polygon points="799,345 831,345 815,323" fill="#5B3350"/>
    <circle cx="815" cy="322" r="5" fill="#F4C64F"/>
  </g>

  <!-- Loblolly pines, left cluster -->
  <g transform="translate(55,398)">
    <rect x="-3" y="-4" width="6" height="26" fill="#8A6642"/>
    <ellipse cx="0" cy="-10" rx="15" ry="11" fill="#3F6B4A"/>
    <ellipse cx="0" cy="-20" rx="9" ry="8" fill="#4C7C52"/>
  </g>
  <g transform="translate(85,404) scale(0.8)">
    <rect x="-3" y="-4" width="6" height="26" fill="#8A6642"/>
    <ellipse cx="0" cy="-10" rx="15" ry="11" fill="#3F6B4A"/>
    <ellipse cx="0" cy="-20" rx="9" ry="8" fill="#4C7C52"/>
  </g>
  <g transform="translate(115,400) scale(0.65)">
    <rect x="-3" y="-4" width="6" height="26" fill="#8A6642"/>
    <ellipse cx="0" cy="-10" rx="15" ry="11" fill="#3F6B4A"/>
    <ellipse cx="0" cy="-20" rx="9" ry="8" fill="#4C7C52"/>
  </g>

  <!-- Marsh grass clumps -->
  <g fill="#5C8A5A">
    <path d="M170,412 C166,398 168,392 170,388 C172,392 174,398 170,412 Z"/>
    <path d="M182,414 C178,400 180,392 182,388 C184,392 186,400 182,414 Z"/>
    <path d="M194,412 C190,400 192,393 194,389 C196,393 198,400 194,412 Z"/>
    <path d="M735,410 C731,396 733,390 735,386 C737,390 739,396 735,410 Z"/>
    <path d="M747,412 C743,398 745,391 747,387 C749,391 751,398 747,412 Z"/>
  </g>

  <!-- Water bands -->
  <path d="M0,415 Q75,400 150,415 T300,415 T450,415 T600,415 T750,415 T900,415 L900,620 L0,620 Z" fill="#BFE8F0"/>
  <path d="M0,458 Q75,441 150,458 T300,458 T450,458 T600,458 T750,458 T900,458 L900,620 L0,620 Z" fill="#6FBFDD"/>
  <path d="M0,508 Q75,489 150,508 T300,508 T450,508 T600,508 T750,508 T900,508 L900,620 L0,620 Z" fill="#2E93B8"/>

  <!-- Boat -->
  <g transform="rotate(-6 470 400)">
    <!-- hull -->
    <path d="M210,410 C210,428 245,448 320,452 C400,456 470,454 545,448 C600,443 655,435 695,398 C660,372 590,358 500,354 C400,350 300,358 245,378 C215,390 208,398 210,410 Z"
          fill="#FBF3E3" stroke="#3D2438" stroke-width="4" stroke-linejoin="round"/>

    <!-- boot stripe -->
    <path d="M215,405 C218,422 250,437 320,440 C395,443 465,442 535,435 C580,431 620,418 668,400 C645,408 590,420 530,426 C460,433 390,435 320,431 C258,428 222,415 215,405 Z"
          fill="#5B3350"/>

    <!-- rubrail -->
    <path d="M210,405 C215,390 245,378 300,368 C380,358 460,354 545,357 C610,360 660,375 695,398"
          fill="none" stroke="#C9975A" stroke-width="7" stroke-linecap="round"/>

    <!-- portholes -->
    <circle cx="300" cy="412" r="14" fill="#FFFFFF" stroke="#3D2438" stroke-width="4"/>
    <circle cx="300" cy="412" r="7" fill="#6FBFDD"/>
    <circle cx="343" cy="406" r="14" fill="#FFFFFF" stroke="#3D2438" stroke-width="4"/>
    <circle cx="343" cy="406" r="7" fill="#6FBFDD"/>
    <circle cx="386" cy="400" r="14" fill="#FFFFFF" stroke="#3D2438" stroke-width="4"/>
    <circle cx="386" cy="400" r="7" fill="#6FBFDD"/>

    <!-- pilothouse cabin -->
    <rect x="415" y="300" width="100" height="58" rx="18" fill="#F6E9CE" stroke="#3D2438" stroke-width="4"/>
    <rect x="428" y="316" width="20" height="18" rx="5" fill="#8FD3E8" stroke="#3D2438" stroke-width="2"/>
    <rect x="458" y="316" width="20" height="18" rx="5" fill="#8FD3E8" stroke="#3D2438" stroke-width="2"/>
    <rect x="488" y="316" width="20" height="18" rx="5" fill="#8FD3E8" stroke="#3D2438" stroke-width="2"/>

    <!-- boom -->
    <line x1="470" y1="358" x2="300" y2="368" stroke="#C9975A" stroke-width="9" stroke-linecap="round"/>

    <!-- mainsail -->
    <path d="M470,115 C415,175 350,255 300,368 L470,358 Z" fill="#FFFFFF" stroke="#2E4756" stroke-width="3" stroke-linejoin="round"/>

    <!-- jib -->
    <path d="M468,150 L690,395 C620,362 545,335 478,308 Z" fill="#F7F7F2" stroke="#2E4756" stroke-width="3" stroke-linejoin="round"/>

    <!-- mast -->
    <line x1="470" y1="358" x2="470" y2="105" stroke="#C9975A" stroke-width="7" stroke-linecap="round"/>

    <!-- pennant -->
    <path d="M470,105 L470,122 L438,113 Z" fill="#F17A5D"/>
  </g>

  <!-- water redrawn in front of the hull so the boat sits in it rather than on top of it -->
  <path d="M0,420 Q75,406 150,420 T300,420 T450,420 T600,420 T750,420 T900,420 L900,620 L0,620 Z" fill="#BFE8F0"/>
  <path d="M0,458 Q75,441 150,458 T300,458 T450,458 T600,458 T750,458 T900,458 L900,620 L0,620 Z" fill="#6FBFDD"/>
  <path d="M0,508 Q75,489 150,508 T300,508 T450,508 T600,508 T750,508 T900,508 L900,620 L0,620 Z" fill="#2E93B8"/>

  <!-- Crab pot buoy -->
  <g transform="translate(650,540)">
    <line x1="0" y1="-30" x2="0" y2="-14" stroke="#8A6642" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="11" ry="15" fill="#FFFFFF" stroke="#3D2438" stroke-width="3"/>
    <rect x="-11" y="-6" width="22" height="9" fill="#F17A5D"/>
  </g>

  <!-- Foreground wave crest highlights -->
  <g stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M60,560 Q90,550 120,560"/>
    <path d="M260,585 Q290,575 320,585"/>
    <path d="M470,555 Q500,545 530,555"/>
    <path d="M740,575 Q770,565 800,575"/>
    <path d="M150,605 Q180,595 210,605"/>
  </g>
</svg>
