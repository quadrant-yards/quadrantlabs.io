<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/svg+xml" href="brand/assets/favicon.svg">
        <title>Quadrant Labs</title>
        <style>
            /* Clear Day paper + border, light and dark (see brand/tokens.css) */
            :root { --paper: #F6F7F3; --border: #DCE2DC; }
            @media (prefers-color-scheme: dark) {
                :root { --paper: #0B1615; --border: #20332F; }
            }

            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background: var(--paper);
            }

            img.hero {
                width: min(90vw, 900px);
                height: auto;
                display: block;
                border-radius: 6px;
                outline: 1px solid var(--border);
            }
        </style>
    </head>
    <body>
        <img src="public/quadrant-sloop.svg" class="hero" alt="Illustration of the Hartge Quadrant sloop under sail on the Chesapeake Bay on a clear afternoon, with an orange channel buoy nearby">
    </body>
</html>
